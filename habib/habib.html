<style>

<div class="wrap">
  <header>
    <div>
      <h1>بيان عشيرة آل حبيب</h1>
      <p class="sub">من ربعة السهلة، قبيلة السادة الخلاوية والنجوع</p>
    </div>
    <div class="header-actions"><button id="unlock" class="unlock-btn" type="button">تفعيل التعديل</button><div class="stats"><span>إجمالي الأسماء <b id="total">0</b></span><span>المعروضة <b id="shown">0</b></span></div></div>
  </header>

  <div class="bar">
    <div class="search"><input id="q" type="search" placeholder="ابحث بالاسم أو السكن أو السجل المدني أو الجوال" autocomplete="off"></div>
    <button id="load">تحميل / جلب البيانات</button>
    <input id="file" type="file" accept=".csv,text/csv" hidden>
    <button id="add" class="primary" disabled>+ إضافة شخص</button>
    <button id="export">تصدير Excel</button>
    <button id="export-csv">تصدير CSV</button>
    <button id="export-docx">تصدير DOCX</button>
    <button id="export-pdf">تصدير PDF</button>
  </div>
  <div class="advanced-filters" aria-label="فلاتر متقدمة">
    <label class="filter-label">السكن<select id="res-filter"><option value="">كل أماكن السكن</option></select></label>
    <label class="filter-label">الالتزام<select id="commit-filter"><option value="">الكل</option><option value="yes">ملتزم</option><option value="no">غير ملتزم</option></select></label>
  </div>
  <div class="chips" id="chips" aria-label="تصفية حسب السكن"></div>

  <section class="stats-panel" aria-labelledby="stats-title">
    <h2 class="stats-title" id="stats-title">توزيع الأفراد حسب مكان السكن</h2>
    <div class="res-chart" id="res-chart" role="img" aria-label="مخطط توزيع الأفراد حسب السكن"></div>
  </section>

  <div class="tablebox">
    <table>
      <thead><tr id="table-head"><th>الرقم</th><th>الاسم</th><th>السكن</th><th>السجل المدني</th><th>معلومات إضافية</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden></div>
  </div>
  <div class="pager"><span id="range"></span><div><button id="prev" class="small">السابق</button><span id="pg"></span><button id="next" class="small">التالي</button></div></div>
</div>

<div class="modal" id="modal" hidden>
  <form class="card" id="form" autocomplete="off">
    <h2 id="mtitle">إضافة شخص</h2>
    <label>الاسم<input id="f-name" required></label>
    <div class="grid">
      <label>السكن<input id="f-res" list="reslist"><datalist id="reslist"></datalist></label>
      <label>السجل المدني<input id="f-cid" inputmode="numeric" dir="ltr" style="text-align:right"></label>
    </div>
    <label>معلومات إضافية<textarea id="f-extra" rows="2"></textarea></label>
    <label>ما الذي عدّلته؟ (اختياري)<textarea id="change-note" rows="2" placeholder="اكتب ملخص التعديل إن رغبت"></textarea></label>
    <div id="group-note" class="note" hidden></div>
    <section class="custom-section"><div class="custom-heading"><strong>خانات إضافية لهذا السجل</strong><button id="add-field" type="button" class="small">+ إضافة خانة</button></div><div id="custom-fields"></div></section>
    <fieldset><legend>من الجدول الأصلي</legend>
      <label class="check"><input type="checkbox" id="f-com"> ملتزم</label>
      <label>رقم الجوال<input id="f-phone" inputmode="tel" dir="ltr" style="text-align:right"></label>
    </fieldset>
    <div id="ferr" class="note" hidden></div>
    <div class="actions">
      <div><button type="submit" class="primary" id="save">حفظ</button><button type="button" id="cancel">إلغاء</button></div>
      <div><button type="button" id="add-group-member" hidden>+ إضافة شخص إلى هذه المجموعة</button><button type="button" class="danger" id="del" hidden>حذف</button></div>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const PAGE=50;
  let rows=[], db=null, canWrite=true, unlocked=false, localMode=false, page=0, resFilter='', editing=null, confirmDel=false, loaded=false, customFieldNames=[], groupTargetId='';

  const norm=s=>(s||'').toString().toLowerCase()
    .replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\s+/g,' ').trim();
  const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function hl(text,q){
    const t=esc(text); if(!q) return t;
    // highlight on raw text when normalization keeps length (it does: 1:1 char map)
    const nt=norm(text); if(nt.length!==text.length) return t;
    const i=nt.indexOf(q); if(i<0) return t;
    return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
  }
  function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}

  function groupSeq(r){const leader=rows.find(x=>x.id===r.groupLeadId);return leader?(leader.seq||''):''}
  function orderedRows(){
    const sorted=rows.slice().sort((a,b)=>(Number(a.seq)||0)-(Number(b.seq)||0));
    const children=new Map(); sorted.forEach(r=>{const k=r.groupLeadId||'';if(k){if(!children.has(k))children.set(k,[]);children.get(k).push(r)}});
    const ids=new Set(sorted.map(r=>r.id)), result=[],seen=new Set();
    function visit(r,depth){if(seen.has(r.id))return;seen.add(r.id);result.push({r,depth});(children.get(r.id)||[]).forEach(c=>visit(c,depth+1))}
    sorted.filter(r=>!r.groupLeadId||!ids.has(r.groupLeadId)).forEach(r=>visit(r,0));
    sorted.forEach(r=>visit(r,0));return result;
  }
  function visible(){
    const q=norm($('q').value);
    return orderedRows().map(({r,depth},i)=>({r,depth,n:r.seq||i+1})).filter(x=>{
      const residence=$('res-filter').value, commitment=$('commit-filter').value;
      if(resFilter && (x.r.residence||'')!==(resFilter==='__none'?'':resFilter)) return false;
      if(residence && (x.r.residence||'')!==residence) return false;
      if(commitment==='yes'&&!x.r.committed)return false;
      if(commitment==='no'&&x.r.committed)return false;
      if(!q) return true;
      return norm([x.r.name,x.r.residence,x.r.civilId,x.r.phone,x.r.extra,x.r.committed?'ملتزم':''].join(' ')).includes(q);
    });
  }
  function renderChips(){
    const c={}; rows.forEach(r=>{const k=r.residence||'';c[k]=(c[k]||0)+1});
    const keys=Object.keys(c).filter(k=>k).sort((a,b)=>c[b]-c[a]);
    let h=`<button class="chip" aria-pressed="${resFilter===''}" data-r="">الكل<i>${rows.length}</i></button>`;
    keys.forEach(k=>h+=`<button class="chip" aria-pressed="${resFilter===k}" data-r="${esc(k)}">${esc(k)}<i>${c[k]}</i></button>`);
    if(c['']) h+=`<button class="chip" aria-pressed="${resFilter==='__none'}" data-r="__none">بدون سكن<i>${c['']}</i></button>`;
    $('chips').innerHTML=h;
    $('reslist').innerHTML=keys.map(k=>`<option value="${esc(k)}">`).join('');
    const selected=$('res-filter').value; $('res-filter').innerHTML='<option value="">كل أماكن السكن</option>'+keys.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join(''); $('res-filter').value=keys.includes(selected)?selected:'';
    renderResidenceChart(c);
  }
  function renderResidenceChart(counts){
    const chart=$('res-chart');
    const entries=Object.entries(counts).map(([name,count])=>({name:name||'بدون سكن',count})).sort((a,b)=>b.count-a.count);
    const total=entries.reduce((sum,item)=>sum+item.count,0);
    const max=Math.max(1,...entries.map(item=>item.count));
    if(!total){chart.innerHTML='<div class="empty">لا توجد بيانات لعرض الإحصائيات.</div>';return}
    chart.innerHTML=entries.map(item=>{
      const pct=(item.count/total*100);
      return `<div class="res-item" title="${esc(item.name)}: ${item.count} (${pct.toFixed(1)}%)"><span class="res-name">${esc(item.name)}</span><div class="res-track"><div class="res-fill" style="width:${(item.count/max*100).toFixed(2)}%"></div></div><span class="res-count">${item.count} — ${pct.toFixed(1)}٪</span></div>`;
    }).join('');
  }
  function render(){
    const q=norm($('q').value), list=visible();
    $('total').textContent=rows.length; $('shown').textContent=list.length;
    const pages=Math.max(1,Math.ceil(list.length/PAGE)); if(page>=pages) page=pages-1;
    const slice=list.slice(page*PAGE,page*PAGE+PAGE);
    const customNames=[...new Set([...customFieldNames,...rows.flatMap(r=>Object.keys(r.custom||{}))])];
    const header=$('table-head');
    if(header) header.innerHTML='<th>الرقم</th><th>الاسم</th><th>السكن</th><th>السجل المدني</th><th class="extra-col">معلومات إضافية</th>'+customNames.map(k=>`<th class="custom-col">${esc(k)}</th>`).join('')+'<th></th>';
    $('rows').innerHTML=slice.map(({r,n,depth})=>`<tr class="${r.groupLeadId?'group-member':''}" style="--depth:${depth||0}">
      <td class="n">${n}</td>
      <td class="name-cell"><div class="name-stack">${r.committed?'<span class="badge committed-badge">ملتزم</span>':''}<div class="nm">${hl(r.name,q)}</div>${r.phone?`<div class="meta"><span class="ph">${hl(r.phone,q)}</span></div>`:''}</div></td>
      <td class="res">${hl(r.residence,q)||'<span style="color:var(--muted)">—</span>'}</td>
      <td class="id">${hl(r.civilId,q)}</td>
      <td class="extra extra-col">${hl(r.extra,q)}</td>
      ${customNames.map(k=>`<td class="extra custom-col">${esc((r.custom||{})[k]||'')}</td>`).join('')}
      <td class="act">${canWrite&&unlocked?`<button class="small" data-e="${r.id}">تعديل</button>`:''}</td></tr>`).join('');
    const e=$('empty');
    if(!loaded){e.hidden=false;e.textContent='جارٍ تحميل البيانات…'}
    else if(!rows.length){e.hidden=false;e.textContent='لا توجد بيانات بعد. أضف أول شخص بزر «إضافة شخص».'}
    else if(!list.length){e.hidden=false;e.textContent='لا توجد نتائج مطابقة للبحث.'}
    else e.hidden=true;
    $('range').textContent=list.length?`عرض ${page*PAGE+1} إلى ${Math.min(list.length,page*PAGE+PAGE)} من ${list.length}`:'';
    $('pg').textContent=`${page+1} / ${pages}`;
    $('prev').disabled=page<=0; $('next').disabled=page>=pages-1;
    renderChips();
  }

  // ---- modal
  function openForm(r){
    editing=r||null; groupTargetId=''; confirmDel=false;
    $('mtitle').textContent=r?'تعديل البيانات':'إضافة شخص';
    $('f-name').value=r?r.name:''; $('f-res').value=r?r.residence:(resFilter&&resFilter!=='__none'?resFilter:'');
    $('f-cid').value=r?r.civilId:''; $('f-extra').value=r?r.extra:''; $('change-note').value=r?(r.changeNote||''):'';
    $('group-note').hidden=true; $('group-note').textContent=''; $('add-group-member').hidden=!(r&&r.committed);
    $('f-com').checked=!!(r&&r.committed); $('f-phone').value=r?r.phone:'';
    const custom=(r&&r.custom)||{}; customFieldNames=[...new Set([...customFieldNames,...Object.keys(custom)])];
    $('custom-fields').innerHTML=Object.entries(custom).map(([k,v])=>customInput(k,v)).join('');
    $('del').hidden=!r; $('del').textContent='حذف'; $('del').classList.remove('solid');
    $('ferr').hidden=true; $('modal').hidden=false; setTimeout(()=>$('f-name').focus(),30);
  }
  function nextSequence(){const used=new Set(rows.map(r=>Number(r.seq)).filter(Number.isFinite));let n=Math.max(0,...used)+1;while(used.has(n))n++;return n}
  function customInput(name='',value=''){return `<div class="custom-fields"><label>اسم الخانة<input class="custom-key" value="${esc(name)}" placeholder="مثال: المهنة"></label><label>القيمة<input class="custom-value" value="${esc(value)}" placeholder="اكتب القيمة"></label></div>`}
  function closeForm(){$('modal').hidden=true;editing=null}
  function err(m){$('ferr').textContent=m;$('ferr').hidden=false}
  function dbErr(e){
    if(e&&(e.code==='invalid_argument')){canWrite=false;$('add').disabled=true;err('ليس لديك صلاحية التعديل على هذه الصفحة.');render()}
    else if(e&&e.code==='quota_exceeded') err('تم الوصول إلى الحد الأقصى لعدد السجلات.');
    else err('تعذر الحفظ. حاول مرة أخرى.');
  }
  $('form').addEventListener('submit',async ev=>{
    ev.preventDefault(); if(!unlocked||!canWrite){err('فعّل التعديل أولًا بكلمة المرور.');return} if(!db&&!localMode) return;
    const name=$('f-name').value.replace(/\s+/g,' ').trim();
    if(!name){err('اكتب الاسم أولاً.');return}
    const custom={}; document.querySelectorAll('#custom-fields .custom-fields').forEach(group=>{const key=group.querySelector('.custom-key').value.trim();const value=group.querySelector('.custom-value').value.trim();if(key){custom[key]=value;if(!customFieldNames.includes(key))customFieldNames.push(key)}});
    const data={name,residence:$('f-res').value.trim(),civilId:$('f-cid').value.trim(),extra:$('f-extra').value.trim(),
      phone:$('f-phone').value.trim(),committed:$('f-com').checked,custom,changeNote:$('change-note').value.trim(),groupLeadId:groupTargetId||(editing&&editing.groupLeadId)||''};
    $('save').disabled=true;
    try{
      if(localMode){
        if(editing){const i=rows.findIndex(r=>r.id===editing.id);const seq=nextSequence();if(i>=0)rows[i]={...rows[i],...data,seq};toast(`تم حفظ التعديل محليًا — رقم CSV ${seq}`)}
        else{const seq=nextSequence();rows.push({id:'local-'+Date.now(),seq,...data});toast('تمت الإضافة محليًا');$('q').value='';resFilter=''}
        page=0;render();closeForm();
      }else{
        if(editing){const seq=nextSequence();await db.collection('members').doc(editing.id).update({...data,seq});toast(`تم حفظ التعديل — رقم CSV ${seq}`)}
        else{const seq=nextSequence();await db.collection('members').doc('m'+String(Date.now())).set({...data,seq,src:''});toast('تمت الإضافة');page=1e6;$('q').value='';resFilter=''}
        closeForm();
      }
    }catch(e){dbErr(e)}
    $('save').disabled=false;
  });
  $('add-group-member').addEventListener('click',()=>{
    if(!editing||!editing.committed||!unlocked||!canWrite)return;
    const leader=editing; openForm(null); groupTargetId=leader.id;
    $('mtitle').textContent='إضافة شخص إلى مجموعة '+leader.name;
    $('group-note').textContent='سيظهر الشخص ضمن مجموعة '+leader.name+' فقط.';$('group-note').hidden=false;
    $('f-com').checked=false;$('f-name').focus();
  });
  $('del').addEventListener('click',async()=>{
    if(!unlocked||!canWrite){toast('فعّل التعديل أولًا بكلمة المرور');return}
    if(!confirmDel){confirmDel=true;$('del').textContent='تأكيد الحذف';$('del').classList.add('solid');return}
    try{if(localMode){rows=rows.filter(r=>r.id!==editing.id);render();toast('تم الحذف محليًا');closeForm()}else{await db.collection('members').doc(editing.id).delete();toast('تم الحذف');closeForm()}}catch(e){dbErr(e)}
  });
  $('cancel').addEventListener('click',closeForm);
  $('modal').addEventListener('mousedown',e=>{if(e.target===$('modal'))closeForm()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeForm()});

  // ---- events
  $('q').addEventListener('input',()=>{page=0;render()});
  $('res-filter').addEventListener('change',()=>{resFilter='';page=0;render()});
  $('commit-filter').addEventListener('change',()=>{page=0;render()});
  $('add-field').addEventListener('click',()=>{$('custom-fields').insertAdjacentHTML('beforeend',customInput())});
  $('unlock').addEventListener('click',()=>{
    const password=window.prompt('أدخل كلمة المرور لتفعيل الإضافة والتعديل والحذف:');
    if(password===null)return;
    if(password==='1144'){if(!window.confirm('إقرار: بتفعيل التعديل ستتمكن من تغيير بيانات مهمة وإضافة سجلات. تأكد من صحة كل تعديل قبل الحفظ. هل توافق على المتابعة؟'))return;unlocked=true;$('add').disabled=!canWrite;render();toast('تم تفعيل التعديل والإضافة')}
    else{unlocked=false;$('add').disabled=true;render();toast('كلمة المرور غير صحيحة')}
  });
  $('add').addEventListener('click',()=>{if(unlocked&&canWrite)openForm()});
  $('prev').addEventListener('click',()=>{page--;render()});
  $('next').addEventListener('click',()=>{page++;render()});
  $('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;resFilter=b.dataset.r;$('res-filter').value='';page=0;render()});
  $('rows').addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(!b||!unlocked||!canWrite)return;openForm(rows.find(r=>r.id===b.dataset.e))});
  function parseCSV(text){
    const out=[]; let row=[], cell='', quoted=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}
      else if(c==='"')quoted=true;
      else if(c===','){row.push(cell);cell=''}
      else if(c==='\n'){row.push(cell);out.push(row);row=[];cell=''}
      else if(c!=='\r')cell+=c;
    }
    if(cell!==''||row.length){row.push(cell);out.push(row)}
    return out;
  }
  $('load').addEventListener('click',()=>$('file').click());
  $('file').addEventListener('change',async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    try{
      const text=(await f.text()).replace(/^\uFEFF/,'');
      const data=parseCSV(text); if(data.length<2)throw new Error('empty');
      const headers=data.shift().map(x=>x.trim());
      const pick=(r,names)=>{const i=headers.findIndex(h=>names.includes(h.trim()));return i<0?'':(r[i]||'').trim()};
      const imported=data.filter(r=>r.some(x=>x.trim())).map((r,i)=>({
        id:'csv-'+i, seq:parseInt(pick(r,['الرقم','رقم']),10)||i+1,
        name:pick(r,['الاسم','اسم']), residence:pick(r,['السكن','مكان السكن']),
        civilId:pick(r,['السجل المدني','رقم السجل المدني']), extra:pick(r,['معلومات إضافية','معلومات اضافية']),
        committed:/^(ملتزم|نعم|true|1)$/i.test(pick(r,['ملتزم'])), phone:pick(r,['الجوال','رقم الجوال']), changeNote:pick(r,['ملاحظات التعديل','ماذا عدل']), groupLeadId:pick(r,['رقم مجموعة الملتزم']), custom:Object.fromEntries(headers.map((h,j)=>[h,(r[j]||'').trim()]).filter(([h,v])=>v&&!['الرقم','رقم CSV','السكن','الاسم','السجل المدني','رقم السجل المدني','معلومات إضافية','معلومات اضافية','ملتزم','الجوال','رقم الجوال','ملاحظات التعديل','ماذا عدل','رقم مجموعة الملتزم'].includes(h)))
      })).filter(r=>r.name);
      if(!imported.length)throw new Error('empty');
      const idsBySeq=new Map(imported.map(r=>[String(r.seq),r.id])); imported.forEach(r=>{if(r.groupLeadId&&idsBySeq.has(String(r.groupLeadId)))r.groupLeadId=idsBySeq.get(String(r.groupLeadId))});
      customFieldNames=[...new Set(imported.flatMap(r=>Object.keys(r.custom||{})))];
      rows=imported; loaded=true; localMode=true; canWrite=true; $('add').disabled=!unlocked; page=0; resFilter='';
      render(); toast(`تم تحميل ${rows.length} سجلًا من الملف`);
    }catch(err){toast('تعذر قراءة الملف. تأكد من أنه CSV وبأعمدة صحيحة.')}
    e.target.value='';
  });

  $('export-csv').addEventListener('click',()=>{
    const items=visible();if(!items.length){toast('لا توجد نتائج لتصديرها');return}
    const customNames=[...new Set([...customFieldNames,...rows.flatMap(r=>Object.keys(r.custom||{}))])];
    const headers=['رقم CSV','الاسم','السكن','السجل المدني','معلومات إضافية','ملتزم','الجوال','ملاحظات التعديل','رقم مجموعة الملتزم',...customNames];
    const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const lines=[headers.map(quote).join(','),...items.map(({r,n})=>[r.seq||n,r.name,r.residence,r.civilId,r.extra,r.committed?'ملتزم':'',r.phone,r.changeNote||'',groupSeq(r),...customNames.map(k=>(r.custom||{})[k]||'')].map(quote).join(','))];
    const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='habib.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1200);toast('تم تصدير نتائج CSV');
  });
  $('export').addEventListener('click',()=>{
    const visibleRows=visible();
    if(!visibleRows.length){toast('لا توجد بيانات لتصديرها');return}
    const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const headers=['رقم CSV','الاسم','السكن','السجل المدني','معلومات إضافية','ملتزم','الجوال','ملاحظات التعديل','رقم مجموعة الملتزم',...customFieldNames];
    const table='<table dir="rtl"><thead><tr>'+headers.map(h=>'<th>'+safe(h)+'</th>').join('')+'</tr></thead><tbody>'+visibleRows.map(({r,n})=>'<tr>'+[n,r.name,r.residence,r.civilId,r.extra,r.committed?'ملتزم':'',r.phone].map(v=>'<td>'+safe(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    const blob=new Blob(['\ufeff<html><head><meta charset="utf-8"></head><body>'+table+'</body></html>'],{type:'application/vnd.ms-excel;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='سجل_عشيرة_آل_حبيب.xls'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });


  $('export-pdf').addEventListener('click',()=>{
    const items=visible(); if(!items.length){toast('لا توجد نتائج لتصديرها');return}
    const escHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const cols=['رقم CSV','الاسم','السكن','السجل المدني','معلومات إضافية','ملاحظات التعديل','مجموعة الملتزم',...customFieldNames];
    const html=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>نتائج سجل العشيرة</title><style>body{font-family:Arial,Tahoma,sans-serif;padding:18px;color:#111}h1{text-align:center;font-size:20px}p{text-align:center}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #777;padding:6px;text-align:right;vertical-align:top}th{background:#eee}@media print{body{padding:0}@page{size:A4 landscape;margin:12mm}}</style></head><body><h1>سجل عشيرة آل حبيب</h1><p>عدد النتائج: ${items.length}</p><table><thead><tr>${cols.map(c=>`<th>${escHtml(c)}</th>`).join('')}</tr></thead><tbody>${items.map(({r,n})=>`<tr>${[r.seq||n,r.name,r.residence,r.civilId,r.extra,r.changeNote||'',groupSeq(r),...customFieldNames.map(k=>(r.custom||{})[k]||'')].map(v=>`<td>${escHtml(v)}</td>`).join('')}</tr>`).join('')}</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>`;
    const w=window.open('','_blank'); if(!w){toast('اسمح بالنوافذ المنبثقة لتصدير PDF');return} w.document.open();w.document.write(html);w.document.close();
  });
  $('export-docx').addEventListener('click',async()=>{
    const visibleRows=visible(); if(!visibleRows.length){toast('لا توجد بيانات لتصديرها');return}
    if(!window.docx){toast('تعذر تحميل مكتبة DOCX. تحقق من اتصال الإنترنت.');return}
    try{
      const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType}=window.docx;
      const headers=['رقم CSV','الاسم','السكن','السجل المدني','معلومات إضافية','ملتزم','الجوال','ملاحظات التعديل','رقم مجموعة الملتزم',...customFieldNames];
      const cell=(text,header=false)=>new TableCell({children:[new Paragraph({alignment:AlignmentType.RIGHT,bidi:true,children:[new TextRun({text:String(text??''),bold:header})]})],verticalAlign:'center'});
      const table=new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[new TableRow({children:headers.map(h=>cell(h,true))}),...visibleRows.map(({r,n})=>new TableRow({children:[r.seq||n,r.name,r.residence,r.civilId,r.extra,r.committed?'ملتزم':'',r.phone,r.changeNote||'',groupSeq(r),...customFieldNames.map(k=>(r.custom||{})[k]||'')].map(v=>cell(v))}))]});
      const doc=new Document({sections:[{properties:{bidi:true},children:[new Paragraph({alignment:AlignmentType.CENTER,bidi:true,children:[new TextRun({text:'سجل عشيرة آل حبيب',bold:true,size:30})]}),new Paragraph({text:`عدد السجلات: ${visibleRows.length}`,alignment:AlignmentType.RIGHT,bidi:true}),table]}]});
      const blob=await Packer.toBlob(doc); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='سجل_عشيرة_آل_حبيب.docx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('تم تصدير ملف DOCX');
    }catch(e){console.error(e);toast('تعذر إنشاء ملف DOCX')}
  });


  // ---- data
  render();
  (async()=>{
    try{
      const user=await claude.use('user');
      const w=user&&user.can?user.can('data.write'):null;
      if(w===false) canWrite=false;
    }catch(e){}
    try{ db=await claude.use('db'); }catch(e){ db=null }
    if(!db){loaded=true;localMode=true;canWrite=true;$('add').disabled=true;render();toast('وضع محلي: أدخل كلمة المرور لتفعيل التعديل والإضافة');return}
    $('add').disabled=!canWrite||!unlocked;
    db.collection('members').orderBy('seq').onSnapshot(snap=>{
      rows=snap.docs.map(d=>({id:d.id,...d.data()}));
      loaded=true; render();
    },e=>{loaded=true;render();$('empty').hidden=false;$('empty').textContent='تعذر تحميل البيانات.'});
  })();
})();
</script>

</body></html>
