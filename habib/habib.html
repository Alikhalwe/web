<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>سجل عشيرة آل حبيب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky toolbar over one wide table; modal form for add/edit. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#18282a; --muted:#63757a; --line:#dde4e3;
  --accent:#0e5a58; --accent-ink:#ffffff; --accent-soft:#e1f0ee;
  --warn:#9a5b00; --warn-soft:#fbefd5; --danger:#b3261e; --danger-soft:#fbe5e3; --head:#e9eeed; --hover:#f3f8f7;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101a1b; --surface:#172426; --ink:#e6eeee; --muted:#93a8ab; --line:#2a3b3d;
  --accent:#4fc0b9; --accent-ink:#06201f; --accent-soft:#1c3a39;
  --warn:#f0b95a; --warn-soft:#3a2d12; --danger:#ff8f86; --danger-soft:#3d1c1a; --head:#1e2e30; --hover:#1b2c2e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a1b; --surface:#172426; --ink:#e6eeee; --muted:#93a8ab; --line:#2a3b3d;
  --accent:#4fc0b9; --accent-ink:#06201f; --accent-soft:#1c3a39;
  --warn:#f0b95a; --warn-soft:#3a2d12; --danger:#ff8f86; --danger-soft:#3d1c1a; --head:#1e2e30; --hover:#1b2c2e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1100px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;min-width:0}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
h1{font-size:1.45rem;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:.88rem;margin:2px 0 0}
.stats{display:flex;gap:18px;font-size:.88rem;color:var(--muted)}
.stats b{color:var(--ink);font-size:1.1rem;font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.danger.solid{background:var(--danger);color:#fff}
button.small{padding:5px 10px;font-size:.85rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{white-space:nowrap;padding:5px 11px;border-radius:99px;font-size:.84rem;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip i{font-style:normal;opacity:.7;font-variant-numeric:tabular-nums;margin-inline-start:5px}
.stats-panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stats-title{margin:0 0 10px;font-size:1rem;font-weight:700}
.res-chart{display:grid;gap:9px}
.res-item{display:grid;grid-template-columns:minmax(90px,150px) minmax(60px,1fr) 90px;gap:10px;align-items:center;font-size:.87rem}
.res-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.res-track{height:12px;background:var(--head);border-radius:99px;overflow:hidden;direction:rtl}
.res-fill{height:100%;background:var(--accent);border-radius:99px;min-width:2px}
.res-count{text-align:left;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:520px){.res-item{grid-template-columns:85px minmax(35px,1fr) 76px;gap:7px;font-size:.8rem}}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:720px}
th,td{text-align:right;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.7}
tbody tr{min-height:58px}tbody tr:nth-child(even){background:color-mix(in srgb,var(--head) 28%,var(--surface))}
tbody tr:hover{background:var(--hover)}
td.n{font-size:1rem;font-weight:700}
td.name-cell{min-width:280px;max-width:520px;white-space:nowrap}
.nm{white-space:nowrap;overflow-wrap:normal}
.nm{display:block;white-space:normal;overflow-wrap:anywhere;line-height:1.9;font-size:1rem}
th{background:var(--head);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:.02em;position:sticky;top:0;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n{width:64px;color:var(--muted);font-variant-numeric:tabular-nums}
td.res{width:150px;white-space:nowrap}
td.id{width:160px;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
td.extra{min-width:150px;color:var(--muted)}
td.act{width:110px;white-space:nowrap;text-align:left}
.nm{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:2px;font-size:.8rem;color:var(--muted)}
.badge{background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:1px 9px;font-weight:600;font-size:.76rem}
.ph{direction:ltr;font-variant-numeric:tabular-nums}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.88rem}
.pager div{display:flex;gap:6px;align-items:center}
.modal{position:fixed;inset:0;background:rgba(5,15,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:20}
.modal[hidden]{display:none!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(520px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;margin-block:auto}
.card h2{margin:0;font-size:1.1rem}
label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted)}
label input,label textarea,label select{color:var(--ink);font-size:1rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.check input{width:18px;height:18px}
fieldset{border:1px dashed var(--line);border-radius:8px;padding:10px 12px 12px;margin:0;display:flex;flex-direction:column;gap:12px}
legend{font-size:.8rem;color:var(--muted);padding-inline:6px}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.actions div{display:flex;gap:8px}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30}
.note{color:var(--danger);font-size:.88rem}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>بيان عشيرة آل حبيب</h1>
      <p class="sub">من ربعة السهلة، قبيلة السادة الخلاوية والنجوع</p>
    </div>
    <div class="stats"><span>إجمالي الأسماء <b id="total">0</b></span><span>المعروضة <b id="shown">0</b></span></div>
  </header>

  <div class="bar">
    <div class="search"><input id="q" type="search" placeholder="ابحث بالاسم أو السكن أو السجل المدني أو الجوال" autocomplete="off"></div>
    <button id="load">تحميل / جلب البيانات</button>
    <input id="file" type="file" accept=".csv,text/csv" hidden>
    <button id="unlock" type="button">تفعيل التعديل</button>
    <button id="add" class="primary" disabled>+ إضافة شخص</button>
    <button id="export">تصدير Excel</button>
    <button id="export-docx">تصدير DOCX</button>
  </div>
  <div class="chips" id="chips" aria-label="تصفية حسب السكن"></div>

  <section class="stats-panel" aria-labelledby="stats-title">
    <h2 class="stats-title" id="stats-title">توزيع الأفراد حسب مكان السكن</h2>
    <div class="res-chart" id="res-chart" role="img" aria-label="مخطط توزيع الأفراد حسب السكن"></div>
  </section>

  <div class="tablebox">
    <table>
      <thead><tr><th>الرقم</th><th>الاسم</th><th>السكن</th><th>السجل المدني</th><th>معلومات إضافية</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden></div>
  </div>
  <div class="pager"><span id="range"></span><div><button id="prev" class="small">السابق</button><span id="pg"></span><button id="next" class="small">التالي</button></div></div>
</div>

<div class="modal" id="modal" hidden>
  <form class="card" id="form" autocomplete="off">
    <h2 id="mtitle">إضافة شخص</h2>
    <label>الاسم<input id="f-name" required></label>
    <div class="grid">
      <label>السكن<input id="f-res" list="reslist"><datalist id="reslist"></datalist></label>
      <label>السجل المدني<input id="f-cid" inputmode="numeric" dir="ltr" style="text-align:right"></label>
    </div>
    <label>معلومات إضافية<textarea id="f-extra" rows="2"></textarea></label>
    <fieldset><legend>من الجدول الأصلي</legend>
      <label class="check"><input type="checkbox" id="f-com"> ملتزم</label>
      <label>رقم الجوال<input id="f-phone" inputmode="tel" dir="ltr" style="text-align:right"></label>
    </fieldset>
    <div id="ferr" class="note" hidden></div>
    <div class="actions">
      <div><button type="submit" class="primary" id="save">حفظ</button><button type="button" id="cancel">إلغاء</button></div>
      <button type="button" class="danger" id="del" hidden>حذف</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const PAGE=50;
  let rows=[], db=null, canWrite=true, unlocked=false, localMode=false, page=0, resFilter='', editing=null, confirmDel=false, loaded=false;

  const norm=s=>(s||'').toString().toLowerCase()
    .replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\s+/g,' ').trim();
  const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function hl(text,q){
    const t=esc(text); if(!q) return t;
    // highlight on raw text when normalization keeps length (it does: 1:1 char map)
    const nt=norm(text); if(nt.length!==text.length) return t;
    const i=nt.indexOf(q); if(i<0) return t;
    return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
  }
  function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}

  function visible(){
    const q=norm($('q').value);
    return rows.map((r,i)=>({r,n:i+1})).filter(x=>{
      if(resFilter && (x.r.residence||'')!==(resFilter==='__none'?'':resFilter)) return false;
      if(!q) return true;
      return norm([x.r.name,x.r.residence,x.r.civilId,x.r.phone,x.r.extra,x.r.committed?'ملتزم':''].join(' ')).includes(q);
    });
  }
  function renderChips(){
    const c={}; rows.forEach(r=>{const k=r.residence||'';c[k]=(c[k]||0)+1});
    const keys=Object.keys(c).filter(k=>k).sort((a,b)=>c[b]-c[a]);
    let h=`<button class="chip" aria-pressed="${resFilter===''}" data-r="">الكل<i>${rows.length}</i></button>`;
    keys.forEach(k=>h+=`<button class="chip" aria-pressed="${resFilter===k}" data-r="${esc(k)}">${esc(k)}<i>${c[k]}</i></button>`);
    if(c['']) h+=`<button class="chip" aria-pressed="${resFilter==='__none'}" data-r="__none">بدون سكن<i>${c['']}</i></button>`;
    $('chips').innerHTML=h;
    $('reslist').innerHTML=keys.map(k=>`<option value="${esc(k)}">`).join('');
    renderResidenceChart(c);
  }
  function renderResidenceChart(counts){
    const chart=$('res-chart');
    const entries=Object.entries(counts).map(([name,count])=>({name:name||'بدون سكن',count})).sort((a,b)=>b.count-a.count);
    const total=entries.reduce((sum,item)=>sum+item.count,0);
    const max=Math.max(1,...entries.map(item=>item.count));
    if(!total){chart.innerHTML='<div class="empty">لا توجد بيانات لعرض الإحصائيات.</div>';return}
    chart.innerHTML=entries.map(item=>{
      const pct=(item.count/total*100);
      return `<div class="res-item" title="${esc(item.name)}: ${item.count} (${pct.toFixed(1)}%)"><span class="res-name">${esc(item.name)}</span><div class="res-track"><div class="res-fill" style="width:${(item.count/max*100).toFixed(2)}%"></div></div><span class="res-count">${item.count} — ${pct.toFixed(1)}٪</span></div>`;
    }).join('');
  }
  function render(){
    const q=norm($('q').value), list=visible();
    $('total').textContent=rows.length; $('shown').textContent=list.length;
    const pages=Math.max(1,Math.ceil(list.length/PAGE)); if(page>=pages) page=pages-1;
    const slice=list.slice(page*PAGE,page*PAGE+PAGE);
    $('rows').innerHTML=slice.map(({r,n})=>`<tr>
      <td class="n">${n}</td>
      <td class="name-cell"><div class="nm">${hl(r.name,q)}</div>${(r.committed||r.phone)?`<div class="meta">${r.committed?'<span class="badge">ملتزم</span>':''}${r.phone?`<span class="ph">${hl(r.phone,q)}</span>`:''}</div>`:''}</td>
      <td class="res">${hl(r.residence,q)||'<span style="color:var(--muted)">—</span>'}</td>
      <td class="id">${hl(r.civilId,q)}</td>
      <td class="extra">${hl(r.extra,q)}</td>
      <td class="act">${canWrite&&unlocked?`<button class="small" data-e="${r.id}">تعديل</button>`:''}</td></tr>`).join('');
    const e=$('empty');
    if(!loaded){e.hidden=false;e.textContent='جارٍ تحميل البيانات…'}
    else if(!rows.length){e.hidden=false;e.textContent='لا توجد بيانات بعد. أضف أول شخص بزر «إضافة شخص».'}
    else if(!list.length){e.hidden=false;e.textContent='لا توجد نتائج مطابقة للبحث.'}
    else e.hidden=true;
    $('range').textContent=list.length?`عرض ${page*PAGE+1} إلى ${Math.min(list.length,page*PAGE+PAGE)} من ${list.length}`:'';
    $('pg').textContent=`${page+1} / ${pages}`;
    $('prev').disabled=page<=0; $('next').disabled=page>=pages-1;
    renderChips();
  }

  // ---- modal
  function openForm(r){
    editing=r||null; confirmDel=false;
    $('mtitle').textContent=r?'تعديل البيانات':'إضافة شخص';
    $('f-name').value=r?r.name:''; $('f-res').value=r?r.residence:(resFilter&&resFilter!=='__none'?resFilter:'');
    $('f-cid').value=r?r.civilId:''; $('f-extra').value=r?r.extra:'';
    $('f-com').checked=!!(r&&r.committed); $('f-phone').value=r?r.phone:'';
    $('del').hidden=!r; $('del').textContent='حذف'; $('del').classList.remove('solid');
    $('ferr').hidden=true; $('modal').hidden=false; setTimeout(()=>$('f-name').focus(),30);
  }
  function closeForm(){$('modal').hidden=true;editing=null}
  function err(m){$('ferr').textContent=m;$('ferr').hidden=false}
  function dbErr(e){
    if(e&&(e.code==='invalid_argument')){canWrite=false;$('add').disabled=true;err('ليس لديك صلاحية التعديل على هذه الصفحة.');render()}
    else if(e&&e.code==='quota_exceeded') err('تم الوصول إلى الحد الأقصى لعدد السجلات.');
    else err('تعذر الحفظ. حاول مرة أخرى.');
  }
  $('form').addEventListener('submit',async ev=>{
    ev.preventDefault(); if(!unlocked||!canWrite){err('فعّل التعديل أولًا بكلمة المرور.');return} if(!db&&!localMode) return;
    const name=$('f-name').value.replace(/\s+/g,' ').trim();
    if(!name){err('اكتب الاسم أولاً.');return}
    const data={name,residence:$('f-res').value.trim(),civilId:$('f-cid').value.trim(),extra:$('f-extra').value.trim(),
      phone:$('f-phone').value.trim(),committed:$('f-com').checked};
    $('save').disabled=true;
    try{
      if(localMode){
        if(editing){const i=rows.findIndex(r=>r.id===editing.id);if(i>=0)rows[i]={...rows[i],...data};toast('تم حفظ التعديل محليًا')}
        else{const seq=rows.reduce((m,r)=>Math.max(m,r.seq||0),0)+1;rows.push({id:'local-'+Date.now(),seq,...data});toast('تمت الإضافة محليًا');$('q').value='';resFilter=''}
        page=0;render();closeForm();
      }else{
        if(editing){await db.collection('members').doc(editing.id).update(data);toast('تم حفظ التعديل')}
        else{const seq=rows.reduce((m,r)=>Math.max(m,r.seq||0),0)+1;await db.collection('members').doc('m'+String(Date.now())).set({...data,seq,src:''});toast('تمت الإضافة');page=1e6;$('q').value='';resFilter=''}
        closeForm();
      }
    }catch(e){dbErr(e)}
    $('save').disabled=false;
  });
  $('del').addEventListener('click',async()=>{
    if(!unlocked||!canWrite){toast('فعّل التعديل أولًا بكلمة المرور');return}
    if(!confirmDel){confirmDel=true;$('del').textContent='تأكيد الحذف';$('del').classList.add('solid');return}
    try{if(localMode){rows=rows.filter(r=>r.id!==editing.id);render();toast('تم الحذف محليًا');closeForm()}else{await db.collection('members').doc(editing.id).delete();toast('تم الحذف');closeForm()}}catch(e){dbErr(e)}
  });
  $('cancel').addEventListener('click',closeForm);
  $('modal').addEventListener('mousedown',e=>{if(e.target===$('modal'))closeForm()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeForm()});

  // ---- events
  $('q').addEventListener('input',()=>{page=0;render()});
  $('unlock').addEventListener('click',()=>{
    const password=window.prompt('أدخل كلمة المرور لتفعيل الإضافة والتعديل والحذف:');
    if(password===null)return;
    if(password==='1144'){unlocked=true;$('add').disabled=!canWrite;render();toast('تم تفعيل التعديل والإضافة')}
    else{unlocked=false;$('add').disabled=true;render();toast('كلمة المرور غير صحيحة')}
  });
  $('add').addEventListener('click',()=>{if(unlocked&&canWrite)openForm()});
  $('prev').addEventListener('click',()=>{page--;render()});
  $('next').addEventListener('click',()=>{page++;render()});
  $('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;resFilter=b.dataset.r;page=0;render()});
  $('rows').addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(!b||!unlocked||!canWrite)return;openForm(rows.find(r=>r.id===b.dataset.e))});
  function parseCSV(text){
    const out=[]; let row=[], cell='', quoted=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}
      else if(c==='"')quoted=true;
      else if(c===','){row.push(cell);cell=''}
      else if(c==='\n'){row.push(cell);out.push(row);row=[];cell=''}
      else if(c!=='\r')cell+=c;
    }
    if(cell!==''||row.length){row.push(cell);out.push(row)}
    return out;
  }
  $('load').addEventListener('click',()=>$('file').click());
  $('file').addEventListener('change',async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    try{
      const text=(await f.text()).replace(/^\uFEFF/,'');
      const data=parseCSV(text); if(data.length<2)throw new Error('empty');
      const headers=data.shift().map(x=>x.trim());
      const pick=(r,names)=>{const i=headers.findIndex(h=>names.includes(h.trim()));return i<0?'':(r[i]||'').trim()};
      const imported=data.filter(r=>r.some(x=>x.trim())).map((r,i)=>({
        id:'csv-'+i, seq:parseInt(pick(r,['الرقم','رقم']),10)||i+1,
        name:pick(r,['الاسم','اسم']), residence:pick(r,['السكن','مكان السكن']),
        civilId:pick(r,['السجل المدني','رقم السجل المدني']), extra:pick(r,['معلومات إضافية','معلومات اضافية']),
        committed:/^(ملتزم|نعم|true|1)$/i.test(pick(r,['ملتزم'])), phone:pick(r,['الجوال','رقم الجوال'])
      })).filter(r=>r.name);
      if(!imported.length)throw new Error('empty');
      rows=imported; loaded=true; localMode=true; canWrite=true; $('add').disabled=!unlocked; page=0; resFilter='';
      render(); toast(`تم تحميل ${rows.length} سجلًا من الملف`);
    }catch(err){toast('تعذر قراءة الملف. تأكد من أنه CSV وبأعمدة صحيحة.')}
    e.target.value='';
  });
  $('export').addEventListener('click',()=>{
    const visibleRows=visible();
    if(!visibleRows.length){toast('لا توجد بيانات لتصديرها');return}
    const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const headers=['الرقم','الاسم','السكن','السجل المدني','معلومات إضافية','ملتزم','الجوال'];
    const table='<table dir="rtl"><thead><tr>'+headers.map(h=>'<th>'+safe(h)+'</th>').join('')+'</tr></thead><tbody>'+visibleRows.map(({r,n})=>'<tr>'+[n,r.name,r.residence,r.civilId,r.extra,r.committed?'ملتزم':'',r.phone].map(v=>'<td>'+safe(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    const blob=new Blob(['\ufeff<html><head><meta charset="utf-8"></head><body>'+table+'</body></html>'],{type:'application/vnd.ms-excel;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='سجل_عشيرة_آل_حبيب.xls'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });

  $('export-docx').addEventListener('click',async()=>{
    const visibleRows=visible(); if(!visibleRows.length){toast('لا توجد بيانات لتصديرها');return}
    if(!window.docx){toast('تعذر تحميل مكتبة DOCX. تحقق من اتصال الإنترنت.');return}
    try{
      const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType}=window.docx;
      const headers=['الرقم','الاسم','السكن','السجل المدني','معلومات إضافية','ملتزم','الجوال'];
      const cell=(text,header=false)=>new TableCell({children:[new Paragraph({alignment:AlignmentType.RIGHT,bidi:true,children:[new TextRun({text:String(text??''),bold:header})]})],verticalAlign:'center'});
      const table=new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[new TableRow({children:headers.map(h=>cell(h,true))}),...visibleRows.map(({r,n})=>new TableRow({children:[n,r.name,r.residence,r.civilId,r.extra,r.committed?'ملتزم':'',r.phone].map(v=>cell(v))}))]});
      const doc=new Document({sections:[{properties:{bidi:true},children:[new Paragraph({alignment:AlignmentType.CENTER,bidi:true,children:[new TextRun({text:'سجل عشيرة آل حبيب',bold:true,size:30})]}),new Paragraph({text:`عدد السجلات: ${visibleRows.length}`,alignment:AlignmentType.RIGHT,bidi:true}),table]}]});
      const blob=await Packer.toBlob(doc); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='سجل_عشيرة_آل_حبيب.docx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('تم تصدير ملف DOCX');
    }catch(e){console.error(e);toast('تعذر إنشاء ملف DOCX')}
  });


  // ---- data
  render();
  (async()=>{
    try{
      const user=await claude.use('user');
      const w=user&&user.can?user.can('data.write'):null;
      if(w===false) canWrite=false;
    }catch(e){}
    try{ db=await claude.use('db'); }catch(e){ db=null }
    if(!db){loaded=true;localMode=true;canWrite=true;$('add').disabled=true;render();toast('وضع محلي: أدخل كلمة المرور لتفعيل التعديل والإضافة');return}
    $('add').disabled=!canWrite||!unlocked;
    db.collection('members').orderBy('seq').onSnapshot(snap=>{
      rows=snap.docs.map(d=>({id:d.id,...d.data()}));
      loaded=true; render();
    },e=>{loaded=true;render();$('empty').hidden=false;$('empty').textContent='تعذر تحميل البيانات.'});
  })();
})();
</script>

</body></html>
