<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأفلام والمسلسلات</title>
    <!-- ربط ملف الستايل (الجزء الثاني) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر وشريط البحث -->
    <header>
        <div class="logo">🎦 VidStream</div>
        <div class="search-box">
            <input type="text" id="search" placeholder="ابحث عن فيلم أو مسلسل...">
            <button id="searchBtn">بحث</button>
        </div>
    </header>

    <!-- البانر الرئيسي (Hero) -->
    <div class="hero" id="hero">
        <div class="hero-content">
            <h1 id="heroTitle">-</h1>
            <p id="heroText">-</p>
        </div>
    </div>

    <!-- صندوق تفاصيل نتائج البحث المباشر (دالة showAndPlay) -->
    <div class="info-box" id="info-box">
        <div class="info-grid">
            <img id="detail-poster" src="" alt="Poster">
            <div>
                <h2 id="detail-title">-</h2>
                <p id="detail-date" style="color: #ffb703; margin: 10px 0; font-weight: bold;"></p>
                <p>⭐ التقييم: <span id="detail-rating">-</span></p>
                <p id="detail-overview" style="margin-top: 10px; color: #ccc; line-height: 1.6;"></p>
            </div>
        </div>
        <div class="player-wrap" id="player-wrap">
            <iframe id="vidfast-player" src="" allowfullscreen></iframe>
        </div>
    </div>

    <!-- شبكة عرض نتائج البحث (دالة displayResults) -->
    <div class="results-container" id="results"></div>

    <!-- صفوف القوائم التلقائية -->
    <div class="section-title">🔥 المحتوى الشائع هذا الأسبوع</div>
    <div class="scroll-row" id="trending"></div>

    <div class="section-title">🎬 يعرض حالياً في السينما</div>
    <div class="scroll-row" id="movieList"></div>

    <div class="section-title">📺 مسلسلات تلفزيونية شائعة</div>
    <div class="scroll-row" id="tvList"></div>

    <div class="section-title">⭐ الأعلى تقييماً</div>
    <div class="scroll-row" id="topList"></div>
ايش
    <!-- النافذة المنبثقة الشاملة (Modal) (دالة details) -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="back-btn" onclick="closeModal()">⬅️ رجوع</button>

            <div class="modal-grid">
                <img id="modalPoster" src="" alt="Poster">
                <div class="details-side">
                    <h2 id="modalTitle">-</h2>
                    <div class="meta-info">
                        <span>⭐ <span id="modalRate">-</span></span>
                        <span id="modalDate">-</span>
                    </div>
                    <p id="modalOverview">-</p>
                    <div id="trailer" class="trailer-box"></div>
                </div>
            </div>

            <!-- لوحة التحكم الديناميكية في الحلقات والمواسم للمسلسلات -->
            <div class="series-controls" id="series-controls">
                <div>
                    <label for="season-select">الموسم:</label>
                    <select id="season-select"></select>
                </div>
                <div>
                    <label for="episode-select">الحلقة:</label>
                    <select id="episode-select"></select>
                </div>
            </div>

            <!-- مشغل سيرفر VidFast داخل النافذة -->
            <div class="modal-player-wrap">
                <iframe id="modal-vidfast-player" src="" allowfullscreen></iframe>          <button class="back-btn" onclick="closeModal()">⬅️ رجوع</button>
            </div>
        </div>
    </div>

    <!-- ربط محرك العمليات (الجزء الثالث) -->
    <script src="app.js"></script>
</body>
</html>
