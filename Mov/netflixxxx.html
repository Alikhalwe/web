<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>افلام علي</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="style2.css">

<style>
/* أزرار الحلقات والمواسم للمسلسلات */
.series-controls {
    display: ;
    background: #232936;
    padding: 15px;
    border-radius: 8px;
    margin-top: 15px;
    gap: 20px;
    justify-content: center;
    align-items: center;
    border: 1px solid #333;
}
.series-controls div { display: center; align-items: center; gap: 10px; }
.series-controls label { font-size: 15px; font-weight: bold; color: #ccc; }
.series-controls select {
    padding: 8px 16px;
    background: #11141a;
    color: #fff;
    border: 1px solid #444;
    border-radius: 5px;
    font-size: 15px;
    cursor: pointer;
    outline: none;
}

.series-controls select:focus { border-color: #e50914; }
.modal-player-wrap { margin-top: 20px; background: #000; border-radius: 8px; overflow: hidden; }
.modal-player-wrap iframe { width: 100%; height:400px; border: none; }</style>

</head>

<body>

<header>

<div class="logo">

🎬 تطوير علي Movie World Pro

</div>

<nav>

<a href="#">الرئيسية</a>

<a href="#movies">أفلام</a>

<a href="#tv">مسلسلات</a>

<a href="#top">الأعلى تقييماً</a>

</nav>

<div class="right">


<input
id="search"
placeholder="ابحث...">

<button
class="iconBtn"
id="searchBtn">

🔍

</button>

</div>

</header>

<div
class="hero"
id="hero">

<div class="heroContent">

<h1 id="heroTitle">

جارٍ التحميل...

</h1>

<p id="heroText">

...

</p>

<button
class="playBtn" id"player-wrap">

▶ مشاهدة التفاصيل

</button>

</div>

</div>

<section>

<div class="sectionTitle">

🔥 الرائج

</div>

<div
class="row"
id="trending">

</div>

</section>
<section id="movies">

<div class="sectionTitle">

🎥 أحدث الأفلام

</div>

<div class="row" id="movieList"></div>

</section>

<section id="tv">

<div class="sectionTitle">

📺 أشهر المسلسلات

</div>

<div class="row" id="tvList"></div>

</section>

<section id="top">

<div class="sectionTitle">

⭐ الأعلى تقييماً

</div>

<div class="row" id="topList"></div>

</section>

<div class="modal" id="modal">

<div class="modalBox">

<img id="modalPoster">

<div class="details">

<h2 id="modalTitle"></h2>

<p id="modalOverview"></p>

<p><b>⭐ التقييم:</b> <span id="modalRate"></span></p>

<p><b>📅 التاريخ:</b> <span id="modalDate"></span></p>



<p><b>الرقم:</b> <span id="modalID"></span></p>

 <div class="rate">الرقم: ${item.id}</div>


 <!-- مشغل سيرفر VidFast داخل النافذة -->
            <div class="modal-player-wrap">
               <iframe id="modal-vidfast-player" src="" allowfullscreen></iframe>

  <button class="close" onclick="closeModal()">

إغلاق

</button>

</div>




            <!-- لوحة التحكم الديناميكية في الحلقات والمواسم للمسلسلات -->
            <div class="series-controls" id="series-controls">
                <div>
                    <label for="season-select">الموسم:</label>
                    <select id="season-select"></select>
                </div>
                <div>
                    <label for="episode-select">الحلقة:</label>
                    <select id="episode-select"></select>


<div id="trailer"></div>
    
<button class="close" onclick="closeModal()">

إغلاق

</button>

    
</div>

</div>

</div>

<footer>

تطوير كريستال علي © 2026

</footer>



    <!-- ربط محرك العمليات (الجزء الثالث) -->
    <script src="app.js"></script>




</body>

</html>
